<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../css/log.css">
</head>
<body>
    
    <div class="pagina">

        
        <aside class="painel-esquerdo">

            <a href="avaliacao.html" class="voltar">
                ← Voltar ao início
            </a>

             <img src="../img/logo branca.png" class="logo" alt="Logo">

            <h1>Área do Gestor</h1>

            <p class="descricao">
                Gerencie setores, perguntas e
                acompanhe as avaliações dos seus
                clientes de forma simples e organizada.
            </p>

            <div class="beneficios">

                <div class="beneficio">
                    
                    <p>Análise de dados com gráficos interativos</p>
                </div>

                <div class="beneficio">
                    
                    <p>Cadastre setores e personalize perguntas</p>
                </div>

                <div class="beneficio">
                  
                    <p>Avaliações dos clientes protegidas</p>
                </div>

            </div>

        </aside>


        <!-- ÁREA DIREITA -->
        <main class="area-login">

            <div class="login-container">

                <h2>Entrar</h2>

                <p class="subtitulo">
                    Acesse o painel de gestão
                </p>


                <!-- ABAS -->
                <div class="abas">

                    <button
                        type="button"
                        class="aba ativa"
                        id="abaEntrar">
                        Login
                    </button>

                    <button
                        type="button"
                        class="aba"
                        id="abaCadastrar">
                        Cadastrar
                    </button>

                </div>


                <!-- FORMULÁRIO DE LOGIN -->
                <form id="formLogin">

                    <div class="campo">

                        <label for="email">
                            E-mail
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Digite seu e-mail"
                            required>

                    </div>


                    <div class="campo">

                        <label for="senha">
                            Senha
                        </label>

                        <input
                            type="password"
                            id="senha"
                            placeholder="Digite sua senha"
                            required>

                    </div>


                    <button
                        type="submit"
                        class="botao-login">
                        Entrar
                    </button>

                </form>


              

            </div>

        </main>

    </div>
    <script src="../js/log.js"></script>
</body>
</html>
