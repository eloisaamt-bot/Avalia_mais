<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Setores</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


    <link rel="stylesheet" href="../css/setor.css">

</head>


<body>

    <div class="pagina">


        <!-- ===================================== -->
        <!-- MENU SUPERIOR -->
        <!-- ===================================== -->

        <header class="menu-superior">


            <!-- LOGO -->

            <div class="logo-area">



                <div class="logo-texto">

                    <strong>Avalia+</strong>

                    <span>Painel de Gestão</span>

                </div>

            </div>



            <!-- NAVEGAÇÃO -->

            <nav class="navegacao">


                <!-- VISÃO GERAL -->

                <a href="visaoGeral.html" class="menu-item">

                    <i class="fa-solid fa-chart-column"></i>

                    <span>
                        Visão Geral
                    </span>

                </a>



                <!-- SETORES -->

                <a href="setor.html" class="menu-item ativo">

                    <i class="fa-solid fa-layer-group"></i>

                    <span>
                        Setores
                    </span>

                </a>



                <!-- AVALIAÇÕES -->

                <a href="avaliacao.html" class="menu-item">
                    <i class="fa-solid fa-star"></i>

                    <span>
                        Avaliações
                    </span>

                </a>



                <!-- SAIR -->

                <button class="menu-item botao-sair" onclick="sair()">

                   <i class="fa-solid fa-right-from-bracket"></i>

                    <span>
                        Sair
                    </span>

                </button>


            </nav>


        </header>



        <!-- ===================================== -->
        <!-- CONTEÚDO PRINCIPAL -->
        <!-- ===================================== -->

        <main class="conteudo">


            <!-- TOPO DA PÁGINA -->

            <header class="topo">





                <div class="usuario-topo">

                    <span class="ponto"></span>

                    Gestor

                </div>


            </header>



            <!-- ===================================== -->
            <!-- ÁREA PRINCIPAL -->
            <!-- ===================================== -->

            <section class="area-principal">


                <!-- CABEÇALHO -->

                <div class="cabecalho-pagina">


                    <div>

                        <h2>
                            Setores
                        </h2>


                        <p id="quantidadeSetores">
                            Carregando setores...
                        </p>

                    </div>



                    <!-- BOTÃO NOVO SETOR -->

                    <button class="botao-novo" onclick="abrirModal()">

                        <span>
                            +
                        </span>

                        Novo Setor

                    </button>


                </div>


                <div class="filtros-setor">

                    <button type="button" class="filtro ativo" onclick="filtrarSetores('todos', this)">
                        Todos
                    </button>

                    <button type="button" class="filtro" onclick="filtrarSetores('ativos', this)">
                        Ativos
                    </button>

                    <button type="button" class="filtro" onclick="filtrarSetores('inativos', this)">
                        Inativos
                    </button>

                </div>
                <!-- ===================================== -->
                <!-- LISTA DOS SETORES -->
                <!-- ===================================== -->

                <!--
                    Os cards dos setores serão
                    criados automaticamente pelo
                    JavaScript através dos dados
                    vindos do banco de dados.
                -->

                <div class="lista-setores" id="listaSetores">

                </div>


            </section>


        </main>


    </div>



    <!-- ===================================== -->
    <!-- MODAL - NOVO SETOR -->
    <!-- ===================================== -->

    <div class="modal-fundo" id="modal">


        <div class="modal">


            <!-- CABEÇALHO DO MODAL -->

            <div class="modal-cabecalho">


                <div>

                    <h2>
                        Novo Setor
                    </h2>


                    <p>
                        Cadastre um novo setor para avaliação.
                    </p>

                </div>



                <!-- FECHAR -->

                <button class="fechar" onclick="fecharModal()">

                    ×

                </button>


            </div>



            <!-- ===================================== -->
            <!-- FORMULÁRIO -->
            <!-- ===================================== -->

            <form id="formSetor">


                <!-- NOME -->

                <div class="campo">


                    <label for="nomeSetor">
                        Nome do setor
                    </label>


                    <input type="text" id="nomeSetor" placeholder="Ex.: Entrega" maxlength="100" required>


                </div>



                <!-- PERGUNTA -->

                <div class="campo">


                    <label for="perguntaSetor">
                        Pergunta de avaliação
                    </label>


                    <textarea id="perguntaSetor" placeholder="Ex.: Como você avalia nosso serviço de entrega?"
                        maxlength="100" required></textarea>


                </div>



                <!-- BOTÕES -->

                <div class="botoes-modal">


                    <button type="button" class="botao-cancelar" onclick="fecharModal()">

                        Cancelar

                    </button>



                    <button type="submit" class="botao-cadastrar">

                        Cadastrar setor

                    </button>


                </div>


            </form>


        </div>


    </div>



    <!-- ===================================== -->
    <!-- JAVASCRIPT -->
    <!-- ===================================== -->

    <script src="../js/setor.js"></script>


</body>

</html>
