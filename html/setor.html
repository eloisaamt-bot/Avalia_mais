<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setor</title>
    <link rel="stylesheet" href="../css/setor.css">
</head>
<body>
    <div class="pagina">

        <!-- MENU LATERAL -->
        <aside class="menu">

            <div class="logo-area">

    

                <div class="logo-texto">
                    <strong>Avalia+</strong>
                    <span>Painel de Gestão</span>
                </div>

            </div>


            <!-- MENU -->
            <nav class="navegacao">

                <a href="visaoGeral.html" class="menu-item">
                    <span class="icone">📊</span>
                    <span>Visão Geral</span>
                </a>

                <a href="setor.html" class="menu-item ativo">
                    <span class="icone">🏢</span>
                    <span>Setores</span>
                </a>

                <a href="avaliacoes.html" class="menu-item">
                    <span class="icone">⭐</span>
                    <span>Avaliações</span>
                </a>

            </nav>


            <!-- PERFIL -->
            <div class="perfil">

                <div class="avatar">
                    A
                </div>

               

                <button class="botao-sair" onclick="sair()">
                    ↪ Sair
                </button>

            </div>

        </aside>


        <!-- CONTEÚDO -->
        <main class="conteudo">

            <!-- TOPO -->
            <header class="topo">

                <h1>Setores</h1>

                <div class="usuario-topo">
                    <span class="ponto"></span>
                    Gestor
                </div>

            </header>


            <!-- ÁREA PRINCIPAL -->
            <section class="area-principal">

                <div class="cabecalho-pagina">

                    <div>
                        <h2>Setores</h2>

                        <p id="quantidadeSetores">
                            4 setores cadastrados
                        </p>
                    </div>

                    <button class="botao-novo" onclick="abrirModal()">
                        <span>+</span>
                        Novo Setor
                    </button>

                </div>


                <!-- CARDS -->
                <div class="lista-setores" id="listaSetores">
                </div>

            </section>

        </main>

    </div>


    <!-- MODAL NOVO SETOR -->

    <div class="modal-fundo" id="modal">

        <div class="modal">

            <div class="modal-cabecalho">

                <div>
                    <h2>Novo Setor</h2>
                    <p>Cadastre um novo setor para avaliação.</p>
                </div>

                <button class="fechar" onclick="fecharModal()">
                    ×
                </button>

            </div>


            <form id="formSetor">

                <div class="campo">

                    <label for="nomeSetor">
                        Nome do setor
                    </label>

                    <input
                        type="text"
                        id="nomeSetor"
                        placeholder="Ex.: Entrega"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="perguntaSetor">
                        Pergunta de avaliação
                    </label>

                    <textarea
                        id="perguntaSetor"
                        placeholder="Ex.: Como você avalia nosso serviço de entrega?"
                        required
                    ></textarea>

                </div>


                <div class="botoes-modal">

                    <button
                        type="button"
                        class="botao-cancelar"
                        onclick="fecharModal()">
                        Cancelar
                    </button>

                    <button
                        type="submit"
                        class="botao-cadastrar">
                        Cadastrar setor
                    </button>

                </div>

            </form>

        </div>

    </div>


     <script src="../js/setor.js"></script>
</body>
</html>
